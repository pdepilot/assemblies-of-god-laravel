<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Send Down Thy Glory">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdff66"/>
      <stop offset="50%" stop-color="#fbfe06"/>
      <stop offset="100%" stop-color="#c9cc05"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fbfe06" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fdff66" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdff66" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbfe06" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glory rays -->
  <g opacity="0.85" filter="url(#glow)">
    <path d="M60 8 L63 35 L60 30 L57 35 Z" fill="url(#rayGrad)"/>
    <path d="M60 8 L78 22 L72 28 L60 30 Z" fill="url(#rayGrad)" opacity="0.7"/>
    <path d="M60 8 L42 22 L48 28 L60 30 Z" fill="url(#rayGrad)" opacity="0.7"/>
    <path d="M60 8 L88 40 L78 42 L60 30 Z" fill="url(#rayGrad)" opacity="0.5"/>
    <path d="M60 8 L32 40 L42 42 L60 30 Z" fill="url(#rayGrad)" opacity="0.5"/>
  </g>

  <!-- Outer ring -->
  <circle cx="60" cy="62" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="60" cy="62" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- Inner glow -->
  <circle cx="60" cy="62" r="36" fill="url(#glowGrad)"/>

  <!-- Dove silhouette -->
  <g transform="translate(60,58) scale(0.55) translate(-155,-100)">
    <path d="M95 75 Q40 55 15 70 Q55 85 88 95 Q120 72 155 78 Q200 65 280 45 Q305 55 290 72 Q220 88 175 98 Q130 108 95 75 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M95 118 Q50 135 20 125 Q60 115 90 108 Q125 125 160 118 Q210 130 285 155 Q305 142 295 128 Q215 105 170 100 Q125 95 95 118 Z" fill="#F5F3EE" opacity="0.9"/>
    <ellipse cx="155" cy="108" rx="42" ry="28" fill="#FAFAF8"/>
  </g>

  <!-- SDTG monogram -->
  <text x="60" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="url(#goldGrad)" letter-spacing="3">SDTG</text>
</svg>
